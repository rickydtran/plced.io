<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLCED.IO</title>
<meta name="description" content="Counting down to Wednesday.">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/plced-icon.svg" type="image/svg+xml">
<link rel="icon" href="/brand/plced-icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/brand/plced-icon-180.png">
<style>
  :root {
    --bg: #f4f1e8;
    --fg: #1f2a1c;
    --muted: #5b6656;
    --card: #ffffff;
    --border: #dcd6c4;
    --accent: #3f8a2a;
    --party: #d9480f;
    --frog: #5fa83a;
    --frog-dark: #3f7d25;
    --belly: #d9ebb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a13;
      --fg: #e8eee2;
      --muted: #9aa894;
      --card: #1e261c;
      --border: #2f3a2c;
      --accent: #8fd16a;
      --party: #ff8a4c;
      --frog: #63ad3d;
      --frog-dark: #437f28;
      --belly: #b9d68a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
    overflow-x: hidden;
  }
  .site-header {
    display: flex;
    justify-content: center;
    padding: 24px 16px 0;
  }
  .site-header img { display: block; height: 28px; width: auto; max-width: 100%; }
  @media (max-width: 480px) {
    .site-header { padding-top: 20px; }
    .site-header img { height: 20px; }
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem 16px;
    text-align: center;
  }
  .frog { width: min(240px, 60vw); height: auto; overflow: visible; }
  .frog .body { animation: breathe 3.2s ease-in-out infinite; transform-origin: 100px 170px; }
  .frog .lid { transform-box: fill-box; transform-origin: center top; transform: scaleY(0); animation: blink 5s infinite; }
  .frog .party { display: none; }
  .is-wednesday .frog { animation: hop 0.9s ease-in-out infinite; }
  .is-wednesday .frog .party { display: inline; }
  .frog .led { opacity: 0.3; }
  .frog .led-blink { opacity: 1; animation: led 2.4s ease-in-out infinite; }
  .is-wednesday .frog .led { opacity: 1; animation: none; }
  @keyframes breathe { 50% { transform: scale(1.025, 0.985); } }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
  @keyframes led { 0%, 45%, 100% { opacity: 1; } 55%, 90% { opacity: 0.25; } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-18px) rotate(-3deg); } 60% { transform: translateY(-18px) rotate(3deg); } }
  h1 {
    margin: 0;
    font-size: clamp(1.5rem, 6vw, 2.5rem);
    letter-spacing: -0.01em;
  }
  .is-wednesday h1 { color: var(--party); }
  .sub { margin: 0; color: var(--muted); }
  .countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
    width: 100%;
    max-width: 460px;
    margin: 0;
  }
  .countdown div {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 4px 10px;
  }
  .countdown dd {
    margin: 0;
    font-size: clamp(1.6rem, 8vw, 2.6rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }
  .countdown dt {
    font-size: clamp(0.5rem, 3vw, 0.75rem);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .countdown div { display: flex; flex-direction: column-reverse; }
  .is-wednesday .countdown { display: none; }
  footer {
    padding: 16px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    .frog, .frog * { animation: none !important; }
  }
</style>
</head>
<body>
<header class="site-header">
  <a href="/">
    <picture>
      <source srcset="/brand/plced-wordmark-reversed.svg" media="(prefers-color-scheme: dark)">
      <img src="/brand/plced-wordmark.svg" alt="PLCED.IO" width="235" height="28">
    </picture>
  </a>
</header>
<main>
  <svg class="frog" viewBox="0 0 200 190" role="img" aria-label="A cartoon frog holding an FPGA development board">
    <g class="body">
      <ellipse cx="100" cy="176" rx="70" ry="8" fill="#000" opacity="0.12"/>
      <!-- back legs -->
      <ellipse cx="42" cy="158" rx="30" ry="16" fill="var(--frog-dark)"/>
      <ellipse cx="158" cy="158" rx="30" ry="16" fill="var(--frog-dark)"/>
      <!-- body -->
      <ellipse cx="100" cy="125" rx="70" ry="52" fill="var(--frog)"/>
      <ellipse cx="100" cy="140" rx="44" ry="32" fill="var(--belly)"/>
      <!-- front feet -->
      <ellipse cx="66" cy="170" rx="16" ry="7" fill="var(--frog-dark)"/>
      <ellipse cx="134" cy="170" rx="16" ry="7" fill="var(--frog-dark)"/>
      <!-- eyes -->
      <circle cx="62" cy="68" r="28" fill="var(--frog)"/>
      <circle cx="138" cy="68" r="28" fill="var(--frog)"/>
      <circle cx="62" cy="66" r="18" fill="#fff"/>
      <circle cx="138" cy="66" r="18" fill="#fff"/>
      <circle cx="65" cy="68" r="9" fill="#1b1b1b"/>
      <circle cx="141" cy="68" r="9" fill="#1b1b1b"/>
      <circle cx="68" cy="64" r="3" fill="#fff"/>
      <circle cx="144" cy="64" r="3" fill="#fff"/>
      <rect class="lid" x="44" y="48" width="36" height="36" rx="18" fill="var(--frog)"/>
      <rect class="lid" x="120" y="48" width="36" height="36" rx="18" fill="var(--frog)"/>
      <!-- cheeks and smile -->
      <ellipse cx="54" cy="112" rx="9" ry="5" fill="#f28c8c" opacity="0.55"/>
      <ellipse cx="146" cy="112" rx="9" ry="5" fill="#f28c8c" opacity="0.55"/>
      <path d="M70 108 Q100 132 130 108" fill="none" stroke="#1b1b1b" stroke-width="4" stroke-linecap="round"/>
      <!-- arms reaching to the dev board -->
      <path d="M40 112 Q36 143 60 149" fill="none" stroke="var(--frog-dark)" stroke-width="12" stroke-linecap="round"/>
      <path d="M160 112 Q164 143 140 149" fill="none" stroke="var(--frog-dark)" stroke-width="12" stroke-linecap="round"/>
      <!-- FPGA dev board -->
      <g class="board">
        <rect x="60" y="124" width="80" height="46" rx="3" fill="#1d6b3c" stroke="#0f4424" stroke-width="1.5"/>
        <circle cx="64.5" cy="128.5" r="1.6" fill="#c9a94a"/>
        <circle cx="135.5" cy="128.5" r="1.6" fill="#c9a94a"/>
        <rect x="85" y="129" width="30" height="30" rx="2" fill="#26292b"/>
        <rect x="89" y="133" width="22" height="22" rx="1.5" fill="#3a3e41"/>
        <circle cx="92" cy="136" r="1.3" fill="#8a9094"/>
        <g fill="#c9a94a">
          <rect x="66" y="163" width="3" height="3"/><rect x="72" y="163" width="3" height="3"/>
          <rect x="78" y="163" width="3" height="3"/><rect x="84" y="163" width="3" height="3"/>
          <rect x="90" y="163" width="3" height="3"/><rect x="96" y="163" width="3" height="3"/>
          <rect x="102" y="163" width="3" height="3"/><rect x="108" y="163" width="3" height="3"/>
          <rect x="114" y="163" width="3" height="3"/><rect x="120" y="163" width="3" height="3"/>
          <rect x="126" y="163" width="3" height="3"/><rect x="132" y="163" width="3" height="3"/>
        </g>
        <rect x="70" y="132" width="9" height="7" rx="1" fill="#2b2b2b"/>
        <rect x="71" y="144" width="5" height="3" fill="#b8865a"/>
        <rect x="71" y="150" width="5" height="3" fill="#b8865a"/>
        <rect x="120" y="147" width="5" height="3" fill="#b8865a"/>
        <rect x="123" y="132" width="8" height="5" rx="1" fill="#e6e6e6"/>
        <circle class="led led-blink" cx="124" cy="155" r="2.4" fill="#ff4d3d"/>
        <circle class="led" cx="131" cy="155" r="2.4" fill="#3dff7a"/>
      </g>
      <!-- hands gripping the board edges -->
      <g fill="var(--frog)" stroke="var(--frog-dark)" stroke-width="1.5">
        <ellipse cx="58" cy="141" rx="4" ry="8"/><ellipse cx="59" cy="149" rx="4" ry="8"/><ellipse cx="58" cy="157" rx="4" ry="8"/>
        <ellipse cx="64" cy="148" rx="5" ry="7"/>
        <ellipse cx="142" cy="141" rx="4" ry="8"/><ellipse cx="141" cy="149" rx="4" ry="8"/><ellipse cx="142" cy="157" rx="4" ry="8"/>
        <ellipse cx="136" cy="148" rx="5" ry="7"/>
      </g>
      <!-- party hat, shown on Wednesday -->
      <g class="party">
        <path d="M100 6 L82 46 L118 46 Z" fill="var(--party)"/>
        <circle cx="100" cy="6" r="6" fill="#ffd43b"/>
        <circle cx="94" cy="32" r="3" fill="#ffd43b"/>
        <circle cx="106" cy="40" r="3" fill="#fff"/>
      </g>
    </g>
  </svg>

  <h1 id="headline">Wednesday is coming</h1>
  <p class="sub" id="sub">Time until Wednesday, my dudes</p>

  <dl class="countdown" aria-live="off">
    <div><dt>Days</dt><dd id="d">0</dd></div>
    <div><dt>Hours</dt><dd id="h">00</dd></div>
    <div><dt>Minutes</dt><dd id="m">00</dd></div>
    <div><dt>Seconds</dt><dd id="s">00</dd></div>
  </dl>
</main>
<footer>plced.io</footer>
<script>
  (function () {
    var WEDNESDAY = 3;
    var el = function (id) { return document.getElementById(id); };
    var pad = function (n) { return String(n).padStart(2, "0"); };

    function nextWednesday(now) {
      var t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      t.setDate(t.getDate() + ((WEDNESDAY - now.getDay() + 7) % 7 || 7));
      return t;
    }

    function tick() {
      var now = new Date();
      var wednesday = now.getDay() === WEDNESDAY;
      document.body.classList.toggle("is-wednesday", wednesday);
      if (wednesday) {
        el("headline").textContent = "It is Wednesday, my dudes";
        el("sub").textContent = "Enjoy it while it lasts.";
      } else {
        var left = Math.max(0, Math.floor((nextWednesday(now) - now) / 1000));
        el("headline").textContent = "Wednesday is coming";
        el("sub").textContent = "Time until Wednesday, my dudes";
        el("d").textContent = Math.floor(left / 86400);
        el("h").textContent = pad(Math.floor(left / 3600) % 24);
        el("m").textContent = pad(Math.floor(left / 60) % 60);
        el("s").textContent = pad(left % 60);
      }
      setTimeout(tick, 1000 - (Date.now() % 1000) + 5);
    }

    tick();
  })();
</script>
</body>
</html>
